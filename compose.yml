services:
  memoria-bff:
    image: memoria-bff
    build:
      context: ./memoria-bff
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./memoria-bff:/app
      - /app/node_modules
    environment:
      - STRAPI_URL=http://memoria-cms:1337/api
      - NODE_ENV=development
      - PORT=3000
    depends_on:
      memoria-cms:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'localhost').on('connect',function(){this.end();process.exit(0)}).on('error',function(){process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

  memoria-cms:
    image: memoria-cms
    build:
      context: ./memoria-cms
      dockerfile: Dockerfile.dev
    ports:
      - "1337:1337"
    volumes:
      - ./memoria-cms:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=1337
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:1337/_health',res=>process.exit(res.statusCode<400?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  memoria-front:
    image: memoria-front
    build:
      context: ./memoria-front
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    volumes:
      - ./memoria-front:/app
      - /app/node_modules
    environment:
      - GRAPHQL_ENDPOINT=http://memoria-bff:3000/graphql
      - GRAPHQL_BROWSER_ENDPOINT=http://localhost:3000/graphql
      - NODE_ENV=development
      - PORT=3001
    depends_on:
      memoria-bff:
        condition: service_healthy